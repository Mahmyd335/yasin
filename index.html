<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BlockWorld - 3D Voxel Survival Sandbox</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23588a38'/><rect y='60' width='100' height='40' fill='%23866043'/></svg>">
</head>
<body>
  <div id="error-banner" style="display:none;position:fixed;top:0;left:0;width:100%;background:rgba(220,30,30,0.95);color:#fff;font-family:monospace;font-size:13px;padding:8px 12px;z-index:999999;white-space:pre-wrap;pointer-events:auto;max-height:30vh;overflow-y:auto;"></div>
  <script>
    window.addEventListener('error', function(e) {
      var b = document.getElementById('error-banner');
      if (b) {
        b.style.display = 'block';
        b.textContent += '[Error] ' + e.message + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')\n';
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var b = document.getElementById('error-banner');
      if (b) {
        b.style.display = 'block';
        b.textContent += '[Promise Error] ' + (e.reason?.message || e.reason) + '\n';
      }
    });
  </script>

  <canvas id="game-canvas"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
